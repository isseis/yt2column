name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Check if changes require running tests/build
  check-changes:
    name: Check changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      has-code-changes: ${{ steps.check.outputs.has-code-changes }}
      has-extension-changes: ${{ steps.check.outputs.has-extension-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The extension's build compiles the article generation modules, so
      # the classification needs go list to find the Go packages they use.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Classify changed files
        id: normal
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$changed_files"

          # Files that do not require running tests:
          #   - *.md (documentation)
          #   - docs/ (documentation)
          #   - .claude/ (Claude Code commands)
          #   - LICENSE
          code_files=$(echo "$changed_files" | grep -vE '(\.md$|^docs/|^\.claude/|^LICENSE$)' || true)

          if [ -z "$code_files" ]; then
            echo "has-code-changes=false" >> "$GITHUB_OUTPUT"
            echo "No code changes detected, skipping tests"
          else
            echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected, running tests"
          fi

          # A separate list for the extension job, of every changed file
          # (the *.md exclusion above does not apply: the fake LLM's articles
          # are embedded in the development module): --no-renames lists both
          # sides of a rename (a file moved out of extension/ still counts),
          # and -z keeps paths with control characters (tabs, newlines)
          # unquoted and intact so the patterns' ^ anchors match them. The
          # job also runs for a change under a directory of the Go packages
          # the article generation modules compile; when those cannot be
          # listed, it runs.
          dep_dirs="$RUNNER_TEMP/wasm-dep-dirs"
          wasm_dep_dirs_ok=false
          if bash extension/scripts/wasm-dep-dirs.sh > "$dep_dirs"; then
            has_extension_changes=$(git -c core.quotePath=false diff -z --no-renames --name-only origin/main...HEAD \
              | bash extension/scripts/has-extension-changes.sh "$dep_dirs")
            wasm_dep_dirs_ok=true
          else
            echo "Listing the article generation modules' Go packages failed; running the extension job"
            has_extension_changes=true
          fi
          echo "has-extension-changes=$has_extension_changes" >> "$GITHUB_OUTPUT"
          echo "wasm-dep-dirs-ok=$wasm_dep_dirs_ok" >> "$GITHUB_OUTPUT"
          echo "Extension job needed: $has_extension_changes"

      - name: Finalize change classification
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOTOOLCHAIN: local
          CISKIP_NORMAL_CODE: ${{ steps.normal.outputs.has-code-changes }}
          CISKIP_NORMAL_EXT: ${{ steps.normal.outputs.has-extension-changes }}
          CISKIP_WASM_DEP_DIRS_OK: ${{ steps.normal.outputs.wasm-dep-dirs-ok }}
          CISKIP_REPO: ${{ github.repository }}
          CISKIP_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CISKIP_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          CISKIP_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CISKIP_PR_NUMBER: ${{ github.event.pull_request.number }}
          CISKIP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CISKIP_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "${CISKIP_NORMAL_CODE:-}" = "false" ]; then
            has_code_changes=false
          else
            has_code_changes=true
          fi

          if [ "${CISKIP_NORMAL_EXT:-}" = "false" ]; then
            has_extension_changes=false
          else
            has_extension_changes=true
          fi

          if [ "$has_code_changes" = "true" ] || [ "$has_extension_changes" = "true" ]; then
            dep_dirs="$RUNNER_TEMP/wasm-dep-dirs"
            result_file=""
            mktemp_status=0
            result_file=$(mktemp "$RUNNER_TEMP/ciskip-result.XXXXXX") || mktemp_status=$?
            if [ "$mktemp_status" -ne 0 ] || [ -z "$result_file" ]; then
              echo "ciskip: fallback to normal classification (mktemp failed, status=$mktemp_status)"
            else
              trap 'rm -f -- "$result_file"' EXIT
              run_status=0
              go run ./cmd/ciskip \
                --repo="${CISKIP_REPO:-}" \
                --head-repo="${CISKIP_HEAD_REPO:-}" \
                --base-repo="${CISKIP_BASE_REPO:-}" \
                --base-ref="${CISKIP_BASE_REF:-}" \
                --pr-number="${CISKIP_PR_NUMBER:-}" \
                --head-sha="${CISKIP_HEAD_SHA:-}" \
                --run-attempt="${CISKIP_RUN_ATTEMPT:-}" \
                --dep-dirs="$dep_dirs" \
                --wasm-dep-dirs-ok="${CISKIP_WASM_DEP_DIRS_OK:-}" \
                --result-file="$result_file" || run_status=$?

              if [ "$run_status" -ne 0 ]; then
                echo "ciskip: fallback to normal classification (go run failed, status=$run_status)"
              elif printf 'skip=true\n' | cmp -s -- - "$result_file"; then
                has_code_changes=false
                has_extension_changes=false
              else
                cmp_status=0
                printf 'skip=false\n' | cmp -s -- - "$result_file" || cmp_status=$?
                if [ "$cmp_status" -ne 0 ]; then
                  echo "ciskip: fallback to normal classification (unexpected result file, status=$cmp_status)"
                fi
              fi
            fi
          fi

          echo "has-code-changes=$has_code_changes" >> "$GITHUB_OUTPUT"
          echo "has-extension-changes=$has_extension_changes" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-code-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (race, coverage)
        run: make test-ci

      - name: Check timing (no race, alone)
        run: make test-parse-norace

      - name: Build
        run: make build

  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-code-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          # Keep in sync with GOLANGCI_VERSION in Makefile.
          version: v2.13.2
          verify: false
          args: --build-tags test,integration --timeout=5m

      # golangci-lint above compiles the integration test only together with
      # the `test` helpers; vet the `-tags integration` build it actually runs in.
      - name: Vet the integration build
        run: go vet -tags integration ./...

      # The WebAssembly core packages must keep building for js/wasm.
      - name: Check the WebAssembly build
        run: make wasm-check

      - name: Verify modules
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only)" ]; then
            echo "ERROR: go mod tidy resulted in changes:"
            git diff
            exit 1
          fi
          echo "PASS: go mod tidy check completed"

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-extension-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: extension/.node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # ext-build builds the article generation modules with go, with the
      # toolchain go.mod names.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # One step per target, so the failing step names the failing check.
      - name: Install dependencies (npm ci)
        run: make ext-install

      - name: Typecheck
        run: make ext-typecheck

      - name: Lint
        run: make ext-lint

      - name: Check formatting
        run: make ext-fmt-check

      - name: Unit tests
        run: make ext-test

      - name: Build and check dist
        run: make ext-build

      - name: Build and check the development build (dist-dev)
        run: make ext-build-dev

      # Only this job has extension/node_modules installed, so only here can
      # a dependency's Go files be seen leaking into the Go tools' ./...
      - name: Verify go list excludes the extension
        run: |
          packages=$(go list ./...)
          if grep '^github.com/isseis/yt2column/extension/' <<< "$packages"; then
            echo "ERROR: go list ./... includes packages under extension/; check the ignore directive in go.mod"
            exit 1
          fi
          echo "PASS: no extension packages in go list ./..."

  # Runs on every pull request, independent of the change classification, so the
  # document text-sync guards run even for a documentation-only change (which
  # check-changes classifies as non-code and would otherwise skip).
  doc-guard:
    name: Documentation guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run documentation sync guards
        run: go test -tags test ./cmd/yt2column ./cmd/fixprguard ./cmd/chief ./cmd/mergepr ./cmd/numreserve ./internal/pipeline ./internal/chief

  # Runs on every pull request, independent of the change classification, so a
  # private key committed anywhere in the repository fails CI.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Reject tracked private keys
        run: |
          status=0
          git grep -n -E -e '-----BEGIN [A-Z0-9 ]*PRIVATE KEY' || status=$?
          case "$status" in
            0) echo "ERROR: a tracked file contains a PEM private key"; exit 1 ;;
            1) echo "PASS: no PEM private key in tracked files" ;;
            *) echo "ERROR: git grep failed with status $status"; exit 1 ;;
          esac
