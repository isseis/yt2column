name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Check if changes require running tests/build
  check-changes:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      has-code-changes: ${{ steps.check.outputs.has-code-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: check
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$changed_files"

          # Files that do not require running tests:
          #   - *.md (documentation)
          #   - docs/ (documentation)
          #   - .claude/ (Claude Code commands)
          #   - LICENSE
          code_files=$(echo "$changed_files" | grep -vE '(\.md$|^docs/|^\.claude/|^LICENSE$)' || true)

          if [ -z "$code_files" ]; then
            echo "has-code-changes=false" >> "$GITHUB_OUTPUT"
            echo "No code changes detected, skipping tests"
          else
            echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected, running tests"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-code-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (race, coverage)
        run: make test-ci

      - name: Build
        run: make build

  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-code-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          # Keep in sync with GOLANGCI_VERSION in Makefile.
          version: v2.13.2
          verify: false
          args: --build-tags test --timeout=5m

      - name: Verify modules
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only)" ]; then
            echo "ERROR: go mod tidy resulted in changes:"
            git diff
            exit 1
          fi
          echo "PASS: go mod tidy check completed"
