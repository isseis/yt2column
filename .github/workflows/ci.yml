name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Check if changes require running tests/build
  check-changes:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      has-code-changes: ${{ steps.check.outputs.has-code-changes }}
      has-extension-changes: ${{ steps.check.outputs.has-extension-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: check
        run: |
          changed_files=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$changed_files"

          # Files that do not require running tests:
          #   - *.md (documentation)
          #   - docs/ (documentation)
          #   - .claude/ (Claude Code commands)
          #   - LICENSE
          code_files=$(echo "$changed_files" | grep -vE '(\.md$|^docs/|^\.claude/|^LICENSE$)' || true)

          if [ -z "$code_files" ]; then
            echo "has-code-changes=false" >> "$GITHUB_OUTPUT"
            echo "No code changes detected, skipping tests"
          else
            echo "has-code-changes=true" >> "$GITHUB_OUTPUT"
            echo "Code changes detected, running tests"
          fi

          has_extension_changes=$(bash extension/scripts/has-extension-changes.sh <<< "$changed_files")
          echo "has-extension-changes=$has_extension_changes" >> "$GITHUB_OUTPUT"
          echo "Extension job needed: $has_extension_changes"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-code-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests (race, coverage)
        run: make test-ci

      - name: Build
        run: make build

  lint:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-code-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          # Keep in sync with GOLANGCI_VERSION in Makefile.
          version: v2.13.2
          verify: false
          args: --build-tags test,integration --timeout=5m

      # golangci-lint above compiles the integration test only together with
      # the `test` helpers; vet the `-tags integration` build it actually runs in.
      - name: Vet the integration build
        run: go vet -tags integration ./...

      - name: Verify modules
        run: |
          go mod tidy
          if [ -n "$(git diff --name-only)" ]; then
            echo "ERROR: go mod tidy resulted in changes:"
            git diff
            exit 1
          fi
          echo "PASS: go mod tidy check completed"

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-extension-changes == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: extension/.node-version
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # One step per target, so the failing step names the failing check.
      - name: Install dependencies (npm ci)
        run: make ext-install

      - name: Typecheck
        run: make ext-typecheck

      - name: Lint
        run: make ext-lint

      - name: Check formatting
        run: make ext-fmt-check

      - name: Unit tests
        run: make ext-test

      - name: Build and check dist
        run: make ext-build

      # Only this job has extension/node_modules installed, so only here can
      # a dependency's Go files be seen leaking into the Go tools' ./...
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go list excludes the extension
        run: |
          packages=$(go list ./...)
          if grep '^github.com/isseis/yt2column/extension/' <<< "$packages"; then
            echo "ERROR: go list ./... includes packages under extension/; check the ignore directive in go.mod"
            exit 1
          fi
          echo "PASS: no extension packages in go list ./..."

  # Runs on every pull request, independent of the change classification, so a
  # private key committed anywhere in the repository fails CI.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Reject tracked private keys
        run: |
          status=0
          git grep -n -E -e '-----BEGIN [A-Z0-9 ]*PRIVATE KEY' || status=$?
          case "$status" in
            0) echo "ERROR: a tracked file contains a PEM private key"; exit 1 ;;
            1) echo "PASS: no PEM private key in tracked files" ;;
            *) echo "ERROR: git grep failed with status $status"; exit 1 ;;
          esac
