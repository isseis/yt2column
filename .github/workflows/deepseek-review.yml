name: Code Review

on:
  # Automatic review is temporarily disabled: the pull_request and issue_comment
  # triggers below are commented out, so the workflow no longer runs on PRs or
  # PR comments. It can still be run by hand from the Actions tab
  # (workflow_dispatch) with an explicit command. Uncomment the two trigger
  # blocks to restore automatic reviews.
  workflow_dispatch:
    inputs:
      command:
        description: Which PR-Agent flow to run
        type: choice
        options:
          - review
          - improve
        default: review
  # pull_request rather than pull_request_target: GitHub blocks the latter by
  # default on public repositories, and this workflow does not need it. It never
  # checks out or runs PR code (PR-Agent reads the PR through the GitHub API), so a
  # pull_request run with secrets is safe as long as only same-repo branches run
  # (the jobs' conditions below skip forks, which get no secrets anyway).
  # pull_request:
  #   types:
  #     - opened
  #     - reopened
  #     - synchronize
  #     - ready_for_review
  # Re-run on demand with an exact "/review" or "/improve" PR comment. This event
  # runs from the default branch with secrets, so it is how a fork PR is reviewed.
  # Each job's condition below restricts who can trigger it and which command it
  # accepts.
  # issue_comment:
  #   types:
  #     - created

# Settings come only from this file: use_repo_settings_file is off so a PR cannot
# override the model, the API base, or the prompts.
permissions:
  contents: read
  issues: write
  pull-requests: write

# The review and the code suggestions run as separate jobs so each gets its own
# 10-minute timeout: the full PR-Agent flow (/review then /improve) exceeds a
# single 10-minute job on a large diff, and a job that hits its timeout is
# cancelled. Each job keeps a distinct concurrency group so one does not cancel
# the other.
jobs:
  review:
    # PR-Agent has no command allowlist, so gate here: on pull_request only for
    # same-repo branches (fork PRs have no secrets to call the model), and on a
    # comment only for trusted commenters, only PR comments, and only "/review"
    # matched exactly (no arguments, so a comment cannot override settings).
    # Concurrency lives on the job, not the workflow, so skipped comment events
    # do not cancel a review in progress.
    if: >-
      ${{ github.event.sender.type != 'Bot' && (
      (github.event_name == 'workflow_dispatch' && inputs.command == 'review') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.body == '/review')) }}
    concurrency:
      group: deepseek-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Code Review
    steps:
      # The action's Dockerfile builds FROM the mutable tag pragent/pr-agent:github_action,
      # so pin the v0.47.0 image by digest instead of using the-pr-agent/pr-agent@<sha>.
      - name: PR-Agent review
        uses: docker://pragent/pr-agent@sha256:31b9aac6ab067bada9a0c1b001d30ebc500ea4487e00a93c18c59b9ef5fa66db # 0.47.0-github_action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CONFIG.MODEL: deepseek/deepseek-flash
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-v4-pro"]'
          CONFIG.REASONING_EFFORT: medium
          CONFIG.RESPONSE_LANGUAGE: ja-JP
          CONFIG.USE_REPO_SETTINGS_FILE: "false"
          CONFIG.USE_GLOBAL_SETTINGS_FILE: "false"
          CONFIG.REPO_CONTEXT_FILES: '["CLAUDE.md", "docs/dev/security.md"]'
          # Headroom over the default 500 so a growing CLAUDE.md cannot silently
          # evict docs/dev/security.md from the context (249 + 50 lines today).
          CONFIG.REPO_CONTEXT_MAX_LINES: "800"
          # testdata holds captured yt-dlp/DeepSeek fixtures (info.json is ~1.4 MB):
          # data, not reviewable code, and large enough to blow the 32k-token budget
          # and starve the real diff. testdata/README.md is kept because it documents
          # the IP-redaction rule for those fixtures. The lock/sum patterns cover
          # files a later dependency bump would add. vendor/** repeats the built-in
          # default because this value replaces it, not appends to it. Globs are
          # anchored at the path start (fnmatch via re.match) and only a leading **/
          # gets a root-level fallback, so list both the root testdata/ and the nested
          # **/testdata/ forms instead of depending on that fallback.
          IGNORE.GLOB: '["testdata/*.json", "testdata/*.json3", "**/testdata/*.json", "**/testdata/*.json3", "vendor/**", "*.sum", "*.lock.hcl", "*.sops.yaml"]'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          # synchronize is handled apart from pr_actions: it runs push_commands.
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          # One summary comment (updated in place) plus line-anchored suggestions.
          PR_REVIEWER.PERSISTENT_COMMENT: "true"
          PR_REVIEWER.PUBLISH_OUTPUT_NO_SUGGESTIONS: "false"
          PR_REVIEWER.REQUIRE_SCORE_REVIEW: "false"
          PR_REVIEWER.REQUIRE_ESTIMATE_EFFORT_TO_REVIEW: "false"
          PR_REVIEWER.REQUIRE_TESTS_REVIEW: "false"
          PR_REVIEWER.ENABLE_HELP_TEXT: "false"
          # Default 3 truncates a bug-dense diff; this repo reports only real
          # defects (P0/P1), so allow a few more findings.
          PR_REVIEWER.NUM_MAX_FINDINGS: "5"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: |
            '''
            あなたはこの Go リポジトリの上級コードレビュアーです。指摘は日本語で書き、コード識別子・パス・引用コードは原文のままにします。
            不具合・セキュリティ・規約違反だけを報告し、問題が無い箇所への肯定コメントや確認コメント、そのままで良いという趣旨のコメントは書きません。

            報告するもの (影響が最悪になる場合で判断する):
            - 重大なバグ (P0/P1) と壊れた動作。
            - セキュリティ上の問題。外部コマンド (yt-dlp) の実行、シークレット (DEEPSEEK_API_KEY, SLACK_WEBHOOK_URL) の扱い、キャッシュの読み書き、ネットワーク送信、プロンプトや公開記事への信頼できないテキストの埋め込みを含む差分は docs/dev/security.md の攻撃ベクタ一覧に照らして確認する。受け入れ基準に書かれていなくても有効な指摘とする。
            - 握りつぶされたエラー、欠けたエラー経路、境界値の誤り。
            - 述べられた理由で失敗し得ないテスト (定数が自身のリテラルと等しいことの検証、呼び出し元のテーブルと同じ行を繰り返すだけのテストなど)。
            - ビルドの失敗、リポジトリ規約 (CLAUDE.md) の違反。
            - 対応する文書 (01_requirements.md, 02_architecture.md, 03_implementation_plan.md) が approved になる前の実装コミット。
            - 共通型の公開フィールド集合、context.Context を先頭に取るインターフェースメソッド、secret.Secret の公開メソッド集合、testutil の //go:build test 行などの契約変更で、internal/pipeline/pipeline_test.go の静的ガードが古いまま残るもの。

            設計規約 (CLAUDE.md):
            - Reject, don't normalize: 不正な入力は黙って修復せず拒否する。
            - Empty is an error: 空の LLM 応答、yt-dlp 成功後の字幕ファイル欠落、途中で切れた生成は、公開せずエラーにする。
            - Declare, don't infer: 呼び出し元の文字列の内容を見て挙動を選ばない。
            - 不変条件は規約ではなく型で守る。

            報告しないもの:
            - 書式、インデント、変数名、軽微なスタイルの好み。
            - レビュースレッドで回答済みの指摘 (対象コードがその後変わった場合を除く)。
            - reflect や unsafe、ガードを迂回するためだけの型エイリアスなど、意図的に作り込んだコードが必要な静的ガード回避。
            - 02_architecture.md §7 のテスト戦略が意図的に _test.go を省いているパッケージの未テスト。
            - 絶対的な時間予算による根拠が無いベンチマークの退行。
            '''

  improve:
    # Same gating as the review job, but only for an exact "/improve" comment.
    if: >-
      ${{ github.event.sender.type != 'Bot' && (
      (github.event_name == 'workflow_dispatch' && inputs.command == 'improve') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.body == '/improve')) }}
    concurrency:
      group: deepseek-improve-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Code Suggestions
    steps:
      # Same pinned image as the review job.
      - name: PR-Agent code suggestions
        uses: docker://pragent/pr-agent@sha256:31b9aac6ab067bada9a0c1b001d30ebc500ea4487e00a93c18c59b9ef5fa66db # 0.47.0-github_action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK.KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CONFIG.MODEL: deepseek/deepseek-flash
          CONFIG.FALLBACK_MODELS: '["deepseek/deepseek-v4-pro"]'
          CONFIG.REASONING_EFFORT: medium
          CONFIG.RESPONSE_LANGUAGE: ja-JP
          CONFIG.USE_REPO_SETTINGS_FILE: "false"
          CONFIG.USE_GLOBAL_SETTINGS_FILE: "false"
          CONFIG.REPO_CONTEXT_FILES: '["CLAUDE.md", "docs/dev/security.md"]'
          # Headroom over the default 500 so a growing CLAUDE.md cannot silently
          # evict docs/dev/security.md from the context (249 + 50 lines today).
          CONFIG.REPO_CONTEXT_MAX_LINES: "800"
          # Same ignore list as the review job (see the comment there).
          IGNORE.GLOB: '["testdata/*.json", "testdata/*.json3", "**/testdata/*.json", "**/testdata/*.json3", "vendor/**", "*.sum", "*.lock.hcl", "*.sops.yaml"]'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          # synchronize is handled apart from pr_actions: it runs push_commands.
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/improve"]'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          PR_CODE_SUGGESTIONS.COMMITTABLE_CODE_SUGGESTIONS: "true"
          PR_CODE_SUGGESTIONS.FOCUS_ONLY_ON_PROBLEMS: "true"
          PR_CODE_SUGGESTIONS.PUBLISH_OUTPUT_NO_SUGGESTIONS: "false"
          PR_CODE_SUGGESTIONS.SUGGESTIONS_SCORE_THRESHOLD: "7"
          # Bound per-file suggestion noise (0 = uncapped).
          PR_CODE_SUGGESTIONS.MAX_SUGGESTIONS_PER_FILE: "3"
          PR_CODE_SUGGESTIONS.EXTRA_INSTRUCTIONS: |
            '''
            提案は日本語で書き、コード識別子・パス・引用コードは原文のままにします。
            実際の不具合・セキュリティ問題・CLAUDE.md の設計規約 (Reject don't normalize, Empty is an error, Declare don't infer, 不変条件は型で守る) の違反を直す提案だけを出します。
            書式、命名、軽微なスタイルの提案は出しません。直すべき点が無い場合は何も提案しません。
            '''
