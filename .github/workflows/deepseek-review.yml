name: Code Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: write

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  setup-deepseek-review:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Code Review
    steps:
      - name: Collect review context
        id: review-context
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          {
            echo "Repository context follows. Use it when applying the rules in the system prompt."
            echo
            for f in CLAUDE.md AGENTS.md docs/dev/security.md; do
              echo "----- $f -----"
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
                "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BASE_SHA}/${f}" || {
                  echo "error: could not fetch ${f} at ${BASE_SHA}" >&2
                  exit 1
                }
              echo
            done
            echo "Please review the following code changes"
          } > "$RUNNER_TEMP/user-prompt.md"
          {
            echo "user-prompt<<PROMPT_EOF"
            cat "$RUNNER_TEMP/user-prompt.md"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      # The wrapper action's own setup step uses the mutable tag hustcer/setup-nu@v3.25, which
      # would run with the API key and a write token. Pin both pieces by full SHA and run the
      # wrapper's review module directly, so the privileged chain is immutable.
      - name: Setup Nu
        uses: hustcer/setup-nu@ccd5bb5426b05a32009c2ba967946231f3919c97 # v3.25
        with:
          version: 0.114.1
      - name: Fetch pinned review module
        shell: bash
        env:
          REVIEW_SHA: eccde2e9781008d795e366b951e313e37af88dd5 # hustcer/deepseek-review v1.21
        run: |
          git init -q "$RUNNER_TEMP/deepseek-review"
          git -C "$RUNNER_TEMP/deepseek-review" fetch -q --depth 1 \
            https://github.com/hustcer/deepseek-review.git "$REVIEW_SHA"
          git -C "$RUNNER_TEMP/deepseek-review" checkout -q FETCH_HEAD
      - name: DeepSeek Code Review
        shell: nu {0}
        env:
          CHAT_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN_INPUT: ${{ github.token }}
          REPO_INPUT: ${{ github.repository }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number }}
          USER_PROMPT_INPUT: ${{ steps.review-context.outputs.user-prompt }}
          SYS_PROMPT_INPUT: |
            You are an expert senior code reviewer for this Go repository.

            Analyze the pull request diff and report your findings in a single review.

            OUTPUT LANGUAGE
            - Write every review comment in Japanese.
            - Keep code identifiers, file paths, and quoted code in their original form.

            WHAT TO REPORT (report a defect by its worst outcome when the code runs)
            - Serious bugs (P0/P1) and broken behavior.
            - Security holes. For a diff that invokes an external command (yt-dlp), handles a secret (DEEPSEEK_API_KEY, SLACK_WEBHOOK_URL), reads or writes the cache, sends data over the network, or embeds untrusted text in a prompt or a published article, review it against docs/dev/security.md's attack-vector list; a finding there is valid even when no acceptance criterion mentions it.
            - A missing error path, an ignored error, or a boundary-value error.
            - A test that cannot fail for its stated reason (e.g. it asserts a constant equals its own literal, or repeats a caller's table without adding coverage).
            - A failing build or a violated repository contract.
            - An implementation commit that predates the `approved` status of its governing document (01_requirements.md, 02_architecture.md, or 03_implementation_plan.md).
            - A contract change (exported field sets of the common types, the context.Context-first interface methods, the English interface contract clauses, secret.Secret's exported method set, or the //go:build test first line of testutil files) that leaves its static guard in internal/pipeline/pipeline_test.go stale.

            REPOSITORY DESIGN RULES TO CHECK (see CLAUDE.md)
            - Reject, don't normalize: malformed caller input must be rejected, not silently repaired.
            - Empty is an error: an empty LLM response, a missing subtitle file after a successful yt-dlp exit, or a truncated generation must be an error, never published.
            - Declare, don't infer: do not choose behavior by inspecting caller string content.
            - Enforce invariants with the type, not with convention.

            WHAT NOT TO REPORT
            - Formatting, indentation, variable naming, or minor style preferences.
            - A finding already answered in its review thread, unless the code it concerns has changed since the answer.
            - Static-guard bypasses that would need deliberately contrived code (a type alias declared only to route around a rule, reflect, or unsafe).
            - A package left untested when the task's 02_architecture.md §7 test strategy intentionally omits its _test.go files.
            - A benchmark regression with no absolute-budget justification for the claimed harm.

            WHEN THERE ARE NO FINDINGS
            - Do not post unnecessary comments. Reply only with "問題なし".
        run: |
          ^nu -I ($env.RUNNER_TEMP | path join deepseek-review nu) -c "
            use review.nu *
            (deepseek-review $env.CHAT_TOKEN
              --model 'deepseek-flash'
              --repo $env.REPO_INPUT
              --pr-number $env.PR_NUMBER_INPUT
              --gh-token $env.GH_TOKEN_INPUT
              --base-url 'https://api.deepseek.com'
              --max-length 0
              --sys-prompt $env.SYS_PROMPT_INPUT
              --user-prompt $env.USER_PROMPT_INPUT
              --temperature 0.3
              --include ''
              --exclude 'pnpm-lock.yaml,package-lock.json,*.lock'
              --comment ''
            )
          "
