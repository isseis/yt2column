<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>yt2column</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1 id="heading"></h1>
      <p id="key-state"></p>
      <div class="field">
        <label id="api-key-label" for="api-key"></label>
        <input
          id="api-key"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="api-key-hint"
        />
        <p id="api-key-hint" class="field-hint"></p>
      </div>
      <div class="field">
        <label id="workspace-id-label" for="workspace-id"></label>
        <input
          id="workspace-id"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="workspace-id-hint"
        />
        <p id="workspace-id-hint" class="field-hint"></p>
      </div>
      <div class="buttons">
        <button id="save" class="action-button" type="button"></button>
        <button id="delete" class="action-button" type="button"></button>
      </div>
      <div id="status" role="status"></div>
      <section id="build" aria-labelledby="build-heading">
        <h2 id="build-heading"></h2>
        <dl id="build-info"></dl>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
