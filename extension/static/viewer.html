<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>yt2column</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header id="video">
      <h1 id="heading" dir="auto" hidden></h1>
      <p id="channel" dir="auto" hidden></p>
      <a id="video-link" target="_blank" rel="noopener noreferrer" hidden></a>
    </header>
    <section id="state"></section>
    <div id="state-status" class="visually-hidden" role="status"></div>
    <section id="article" hidden></section>
    <section id="actions" hidden>
      <button
        id="publish"
        class="action-button"
        type="button"
        disabled
      ></button>
      <div id="publish-row"></div>
      <button id="save" class="action-button" type="button" disabled></button>
      <button id="copy" class="action-button" type="button" disabled></button>
      <div id="action-status" role="status"></div>
    </section>
  </body>
</html>
