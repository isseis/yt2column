# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# The built-in docstring coverage check measures the functions touched by the
# diff, including test functions, and offers no way to exclude test files. It is
# therefore disabled; doc comments on exported production identifiers stay
# enforced by revive (`exported`, `package-comments`) in `make lint`.
# `inheritance: true` keeps the existing organization/repository UI settings.
inheritance: true
reviews:
  # CodeRabbit's PR review is rationed per developer per hour, and each push
  # would spend one review. The PR is reviewed once when it opens; later changes
  # are reviewed locally with the CLI, and `/runpr` requests a further PR review
  # only when `.claude/commands/_lib/pr-review-escalation.md` says so.
  auto_review:
    auto_incremental_review: false
  pre_merge_checks:
    docstrings:
      mode: "off"
