repos:
-   repo: local
    hooks:
    -   id: go-test
        name: go test
        entry: go test -tags test ./...
        language: system
        types: [go]
        pass_filenames: false

    -   id: go-tidy
        name: go tidy
        entry: go mod tidy
        language: system
        types: [go]
        pass_filenames: false

    -   id: golangci-lint
        name: golangci-lint
        # Version pinned via `go run` (not the system-installed golangci-lint)
        # so this hook always matches the Makefile's GOLANGCI_VERSION. Keep
        # the version below in sync with GOLANGCI_VERSION in Makefile.
        entry: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run --build-tags test
        language: system
        types: [go]
        pass_filenames: false

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        exclude: ^testdata/
    -   id: check-merge-conflict
    -   id: no-commit-to-branch
        args: [--branch, main]

-   repo: https://github.com/shutter-network/pre-commit-go-hooks
    rev: 53239641ec106cda9a7acf9150c98be8d5ffa1ec
    hooks:
    -   id: gofumpt
